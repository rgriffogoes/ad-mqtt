name: Lint

on:
  push:
    branches: [ "main" ]
    paths-ignore: [ "**/*.md" ]
  pull_request:
    branches: [ "main" ]
    paths-ignore: [ "**/*.md" ]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-test.txt

      - name: flake8
        run: flake8 ad_mqtt

      - name: pylint
        run: pylint ad_mqtt
