name: Docker Image CI (build, smoke test, push)

on:
  push:
    branches: [ "main" ]
    paths-ignore: [ "**/*.md" ]
  pull_request:
    branches: [ "main" ]
    paths-ignore: [ "**/*.md" ]

permissions:
  contents: read

env:
  IMAGE: rgriffogoes/ad-mqtt

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: "."
          file: "Dockerfile"
          load: true
          tags: ${{ env.IMAGE }}:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify image runs as non-root
        run: |
          uid="$(docker run --rm --entrypoint id ${{ env.IMAGE }}:ci -u)"
          echo "image uid=$uid"
          test "$uid" = "1000"

      - name: Verify imports
        run: |
          docker run --rm --entrypoint python ${{ env.IMAGE }}:ci -c \
            "import ad_mqtt, paho.mqtt, alarmdecoder, insteon_mqtt; print('imports OK')"

      - name: Smoke test entrypoint
        run: |
          printf 'def get_devices():\n    return []\n' > ci_devices.py
          # Create (not run) the container, copy the devices file in, then
          # start it. A host bind-mount of "$PWD/..." fails on containerized
          # runners (e.g. Forgejo act_runner) because $PWD is a job-container
          # path the host Docker daemon cannot see; Docker would silently
          # create an empty directory at /home/devices.py and the app would
          # crash with IsADirectoryError. docker cp avoids that entirely.
          cid="$(docker create \
            -e ADMQTT_SOCKET_HOST=127.0.0.1 \
            -e ADMQTT_MQTT_HOST=127.0.0.1 \
            ${{ env.IMAGE }}:ci)"
          docker cp ci_devices.py "$cid:/home/devices.py"
          docker start "$cid"
          # Give the app time to start and enter its poll loop.
          sleep 15
          # Inspect first, then stop/remove, so a startup crash is not masked
          # by an auto-removed container ("no such object").
          running="$(docker inspect -f '{{.State.Running}}' "$cid")"
          docker logs "$cid" 2>&1 | tail -20
          docker stop -t 1 "$cid" >/dev/null
          docker rm "$cid" >/dev/null
          # The app loops forever retrying, so a running container means it
          # started cleanly; an early exit means it crashed on startup.
          if [ "$running" != "true" ]; then
            echo "::error::app exited during startup"
            exit 1
          fi
          echo "entrypoint OK"

      - name: Compute image tag
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: meta
        run: echo "sha12=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - name: Login to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Push the exact image that passed the smoke tests above, so what is
      # published is what was verified.
      - name: Push image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker tag "${{ env.IMAGE }}:ci" "${{ env.IMAGE }}:${{ steps.meta.outputs.sha12 }}"
          docker tag "${{ env.IMAGE }}:ci" "${{ env.IMAGE }}:latest"
          docker push "${{ env.IMAGE }}:${{ steps.meta.outputs.sha12 }}"
          docker push "${{ env.IMAGE }}:latest"
